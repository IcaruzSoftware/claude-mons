appId: dev.claude-mons.desktop
productName: claude-mons
copyright: Copyright © 2026 Gerrit Visser and claude-mons contributors
# electron-builder derives updaterCacheDirName (and a few legacy fallbacks) from package.json's
# "name", not "productName". Our package.json name is the pnpm workspace name "@claude-mons/desktop",
# which sanitizes to "@claude-monsdesktop" and would give electron-updater a wrong/ugly cache dir.
# Overriding it here (packaging metadata only, package.json is untouched) keeps updaterCacheDirName
# in resources/app-update.yml as "claude-mons-updater". See docs/runbooks/release.md.
extraMetadata:
  name: claude-mons
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: ../../packages/hook-cli/dist/${os}-${arch}/
    to: bin/
    filter:
      - '**/*'
asar: true
compression: normal
npmRebuild: false
publish:
  provider: github
  owner: IcaruzSoftware
  repo: claude-mons
  releaseType: release
# electron-builder only writes resources/app-update.yml from its own afterPack listener when the
# packaging pass produces an updater-aware target (nsis) directly; it is skipped for a `--dir`
# build (an internal "dir" no-op target) and for a `--prepackaged` build (afterPack never fires at
# all). CI's Windows job packages in exactly that --dir + --prepackaged two-step, which otherwise
# ships installs with no app-update.yml (ENOENT from electron-updater). See
# scripts/after-pack.mjs and docs/runbooks/release.md.
afterPack: scripts/after-pack.mjs

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: claude-mons
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true

linux:
  executableName: claude-mons
  executableArgs: ['--ozone-platform=x11', '--disable-gpu']
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: resources/icons
  category: Utility
  synopsis: Pokémon, but for Claude Code. Train a desktop pet by prompting Claude.
  desktop:
    entry:
      Name: claude-mons
      Comment: Train your desktop mon by using Claude Code
      StartupWMClass: claude-mons
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
deb:
  maintainer: 'IcaruzSoftware <106014197+IcaruzSoftware@users.noreply.github.com>'
  packageCategory: utils
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
