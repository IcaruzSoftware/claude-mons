name: Release

# Builds installers for a tag (or manually) and publishes them to GitHub Releases.
# Windows binaries are code-signed through SignPath (https://signpath.org) via its REST API
# (scripts/signpath-sign.ps1; the connector-based GitHub Action needs a trusted-build-system setup
# that is not available on every plan)
# when the repository has the secrets SIGNPATH_API_TOKEN and SIGNPATH_ORGANIZATION_ID and the
# variable SIGNPATH_PROJECT_SLUG. Without them the workflow still runs and produces unsigned builds.
# See docs/runbooks/release.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      apt_dry_run:
        description: 'Build the apt repository in --dry-run mode (no signing, no gh-pages push) and upload it as an artifact for inspection'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

jobs:
  linux:
    name: build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm hook:build
      - run: pnpm --filter @claude-mons/desktop build
      - name: Package (AppImage, deb)
        working-directory: apps/desktop
        run: pnpm exec electron-builder --linux --publish never
      - name: Publish to GitHub Releases
        if: env.PUBLISH == 'always'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest-linux.yml
      - uses: actions/upload-artifact@v4
        with:
          name: claude-mons-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest-linux.yml
          if-no-files-found: error

  apt:
    name: publish apt repository
    runs-on: ubuntu-latest
    needs: linux
    if: startsWith(github.ref, 'refs/tags/v') || inputs.apt_dry_run == true
    steps:
      - uses: actions/checkout@v4

      - name: Install apt repository tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg

      - uses: actions/download-artifact@v4
        with:
          name: claude-mons-linux
          path: artifacts/linux

      - name: Decide apt job mode
        id: mode
        run: |
          if [ "${{ inputs.apt_dry_run == true }}" = "true" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.APT_GPG_PRIVATE_KEY }}" ] && [ -n "${{ secrets.APT_GPG_PASSPHRASE }}" ]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::APT_GPG_PRIVATE_KEY or APT_GPG_PASSPHRASE secret is missing; skipping apt repository publish (see docs/runbooks/apt-repository.md)"
          fi

      - name: Import GPG signing key
        if: steps.mode.outputs.mode == 'publish'
        id: gpg
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --yes --import
          key_id="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^sec/ { print $5; exit }')"
          if [ -z "$key_id" ]; then
            echo "apt: no secret key found after import" >&2
            exit 1
          fi
          echo "key-id=$key_id" >> "$GITHUB_OUTPUT"

      - name: Check out gh-pages
        if: steps.mode.outputs.mode == 'publish'
        run: |
          git fetch origin gh-pages || echo "apt: gh-pages does not exist yet on origin"
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add -B gh-pages gh-pages-checkout origin/gh-pages
          else
            echo "apt: creating gh-pages branch for the first time"
            git worktree add --detach gh-pages-checkout
            git -C gh-pages-checkout checkout --orphan gh-pages
            git -C gh-pages-checkout rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Build apt repository (dry run)
        if: steps.mode.outputs.mode == 'dry-run'
        run: |
          mkdir -p apt-dry-run
          bash scripts/build-apt-repo.sh --deb-dir artifacts/linux --out-dir apt-dry-run --dry-run

      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.mode == 'dry-run'
        with:
          name: apt-repo-dry-run
          path: apt-dry-run
          if-no-files-found: error

      - name: Build apt repository (publish)
        if: steps.mode.outputs.mode == 'publish'
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          bash scripts/build-apt-repo.sh --deb-dir artifacts/linux --out-dir gh-pages-checkout --key-id "${{ steps.gpg.outputs.key-id }}"

      - name: Stage install.sh and gh-pages scaffolding
        if: steps.mode.outputs.mode == 'publish'
        run: |
          cp scripts/install-claude-mons.sh gh-pages-checkout/install.sh
          touch gh-pages-checkout/.nojekyll
          cat > gh-pages-checkout/index.html <<'HTML'
          <!doctype html>
          <html>
            <head><meta charset="utf-8"><title>claude-mons apt repository</title></head>
            <body>
              <h1>claude-mons</h1>
              <p>Install: <code>curl -fsSL https://icaruzsoftware.github.io/claude-mons/install.sh | sudo bash</code></p>
              <p>Docs: <a href="https://github.com/IcaruzSoftware/claude-mons/blob/main/docs/runbooks/apt-repository.md">docs/runbooks/apt-repository.md</a></p>
            </body>
          </html>
          HTML

      - name: Commit and push gh-pages
        if: steps.mode.outputs.mode == 'publish'
        working-directory: gh-pages-checkout
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add -A
          if git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" diff --cached --quiet; then
            echo "apt: no changes to publish"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish apt repository for ${{ github.ref_name }}"
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" push origin HEAD:gh-pages
          fi

  windows:
    name: build + sign (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm hook:build
      - run: pnpm --filter @claude-mons/desktop build

      - name: Decide whether signing is configured
        id: sign
        shell: bash
        run: |
          if [ -n "${{ secrets.SIGNPATH_API_TOKEN }}" ] && [ -n "${{ secrets.SIGNPATH_ORGANIZATION_ID }}" ] && [ -n "${{ vars.SIGNPATH_PROJECT_SLUG }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SignPath secrets not configured; producing unsigned Windows build"
          fi

      # --- pass 1: sign the executables that go inside the installer ------------------------------
      - name: Stage unpacked app
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win --dir --publish never

      - name: Sign executables (SignPath REST API)
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNING_POLICY: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
        run: |
          New-Item -ItemType Directory -Force sign/pass1 | Out-Null
          Copy-Item apps/desktop/release/win-unpacked/claude-mons.exe sign/pass1/
          Copy-Item packages/hook-cli/dist/win-x64/claude-mons-hook.exe sign/pass1/
          Compress-Archive -Path sign/pass1/* -DestinationPath sign/pass1.zip -Force
          ./scripts/signpath-sign.ps1 -InputZip sign/pass1.zip -OutputDir sign/pass1-signed -ArtifactConfiguration executables
          Copy-Item sign/pass1-signed/claude-mons.exe apps/desktop/release/win-unpacked/claude-mons.exe -Force
          Copy-Item sign/pass1-signed/claude-mons-hook.exe apps/desktop/release/win-unpacked/resources/bin/claude-mons-hook.exe -Force

      # --- installer ---------------------------------------------------------------------------
      - name: Build NSIS installer from the (signed) unpacked app
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win --prepackaged release/win-unpacked --publish never

      # --- pass 2: sign the installer -----------------------------------------------------------
      - name: Sign installer (SignPath REST API)
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNING_POLICY: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
        run: |
          New-Item -ItemType Directory -Force sign/pass2 | Out-Null
          Copy-Item apps/desktop/release/*.exe sign/pass2/
          Compress-Archive -Path sign/pass2/*.exe -DestinationPath sign/pass2.zip -Force
          ./scripts/signpath-sign.ps1 -InputZip sign/pass2.zip -OutputDir sign/pass2-signed -ArtifactConfiguration installer
          Copy-Item sign/pass2-signed/*.exe apps/desktop/release/ -Force
          # latest.yml carries the installer sha512 and the blockmap derives from the bytes; refresh both
          node scripts/refresh-latest-yml.mjs apps/desktop/release

      - name: Publish to GitHub Releases
        if: env.PUBLISH == 'always'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml

      - uses: actions/upload-artifact@v4
        with:
          name: claude-mons-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
