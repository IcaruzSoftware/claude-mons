name: Supabase keepalive

# Free-tier Supabase projects pause after a week without traffic. Ping the public heartbeat
# function daily; it also prunes ephemeral tables (xp_minutes, ingest_batches).
# heartbeat is deployed with verify_jwt = false, so no secret is required. If SUPABASE_ANON_KEY
# is configured as a repository secret it is passed as the `apikey` header anyway.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call heartbeat
        env:
          HEARTBEAT_URL: https://dbeotjfprckdrymmpexv.supabase.co/functions/v1/heartbeat
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || '' }}
        run: |
          set -euo pipefail
          args=(-fsS --retry 3 --retry-delay 10 --max-time 60)
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            args+=(-H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          fi
          curl "${args[@]}" "$HEARTBEAT_URL" | tee heartbeat.json
          grep -q '"ok":true' heartbeat.json
