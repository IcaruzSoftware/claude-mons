# Supabase CLI project config (CLI 2.x). Generated in the spirit of `supabase init`, trimmed to what
# claude-mons needs. Local values only affect `supabase start`; `[auth]` and `[functions.*]` are
# also pushed to the hosted project by `supabase config push` / `supabase functions deploy`.
project_id = "claude-mons"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = false
minimum_password_length = 6

[auth.rate_limit]
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[functions.heartbeat]
enabled = true
verify_jwt = false
entrypoint = "./functions/heartbeat/index.ts"

[functions.create-profile]
enabled = true
verify_jwt = true
entrypoint = "./functions/create-profile/index.ts"

[functions.ingest-xp]
enabled = true
verify_jwt = true
entrypoint = "./functions/ingest-xp/index.ts"

[functions.battle-request]
enabled = true
verify_jwt = true
entrypoint = "./functions/battle-request/index.ts"
